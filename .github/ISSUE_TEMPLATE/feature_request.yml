name: Feature Request
description: Suggest a new feature for Arc Emulator
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        **Already suggested?** Give that issue a 👍 instead - that's how I decide what to build next.

        Just tell me what's bugging you - a couple of sentences is plenty.

  - type: input
    id: version
    attributes:
      label: App Version (optional)
      placeholder: "e.g., 1.1.0"

  - type: textarea
    id: description
    attributes:
      label: What would you like?
      description: What's the feature, and what problem does it solve for you?
      placeholder: "e.g., folders by genre — my library has 500+ games and it's hard to find anything."
    validations:
      required: true

  - type: textarea
    id: notes
    attributes:
      label: Anything else? (optional)
      description: How you'd imagine it working, screenshots, etc. Or just leave this blank.
      placeholder: "e.g., maybe a dropdown next to the sort button?"

  - type: checkboxes
    id: checklist
    attributes:
      label: Checklist
      options:
        - label: "I have searched the existing issues and feature requests for duplicates"
          required: true

